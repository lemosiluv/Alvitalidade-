<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Código QR para abrir a apresentação da ALVITALIDADE no navegador.">
  <title>QR Code — ALVITALIDADE</title>
  <style>
    :root { color-scheme: light; --green: #245618; --orange: #e8862e; --ink: #22301c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fdfcf8; color: var(--ink); font-family: Arial, sans-serif; text-align: center; }
    main { width: min(100%, 520px); padding: 36px 24px; background: #fff; border: 1px solid #e7ecdf; border-radius: 20px; box-shadow: 0 16px 48px #24561818; }
    h1 { margin: 0 0 10px; color: var(--green); }
    p { line-height: 1.6; }
    img { display: block; width: min(100%, 320px); height: auto; margin: 24px auto; }
    a, button { display: inline-block; margin: 6px; padding: 12px 18px; border: 0; border-radius: 24px; background: var(--green); color: #fff; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    button { background: var(--orange); }
    .note { color: #5c6b55; font-size: .9rem; }
    @media print { body { padding: 0; } main { border: 0; box-shadow: none; } a, button, .note { display: none; } }
  </style>
</head>
<body>
  <main>
    <h1>ALVITALIDADE</h1>
    <p>Leia este código QR com a câmara do seu telemóvel para abrir a apresentação no navegador.</p>
    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=320x320&amp;margin=12&amp;data=https%3A%2F%2Fhtmlpreview.github.io%2F%3Fhttps%3A%2F%2Fraw.githubusercontent.com%2Flemosiluv%2FAlvitalidade-%2Fmain%2Findex.html"
      alt="Código QR para abrir a apresentação HTML da ALVITALIDADE"
      width="320" height="320">
    <a href="https://htmlpreview.github.io/?https://raw.githubusercontent.com/lemosiluv/Alvitalidade-/main/index.html" target="_blank" rel="noopener">Abrir apresentação</a>
    <button type="button" onclick="window.print()">Imprimir / Guardar em PDF</button>
    <p class="note">A apresentação e o código QR precisam de ligação à internet para abrir.</p>
  </main>
</body>
</html>
